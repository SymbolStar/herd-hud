name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dsh-plugin:
    name: DSH plugin tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-claude-agents
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          node --check herdr.js
          node --check machines.js

      - name: Tests
        run: |
          node test/board.test.mjs
          node test/machines.test.mjs

  agent-hud:
    name: Build Agent HUD
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swiftc --version
          git rev-list --count HEAD

      - name: Build
        run: ./agent-hud/build.sh

      - name: Verify version stamping
        run: |
          APP="agent-hud/build/Agent HUD.app"
          test -x "$APP/Contents/MacOS/AgentHUD"

          # Info.plist must carry the VERSION file's value.
          EXPECTED="$(head -1 VERSION | tr -d '[:space:]')"
          ACTUAL="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          echo "VERSION=$EXPECTED  Info.plist=$ACTUAL"
          [ "$EXPECTED" = "$ACTUAL" ]

          # Build number is the commit count, so it must be a positive integer.
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")"
          echo "CFBundleVersion=$BUILD"
          [ "$BUILD" -ge 1 ]

      - name: Check the binary reports its version
        run: |
          APP="agent-hud/build/Agent HUD.app"
          # --dump prints a JSON board even without Herdr; hudVersion comes from
          # the generated BuildVersion.swift, not from the running server.
          OUT="$("$APP/Contents/MacOS/AgentHUD" --dump --no-remote)"
          echo "$OUT" | head -5
          echo "$OUT" | grep -q '"hudVersion"'
