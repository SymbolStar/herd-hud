name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Supersede an older run of the same PR; keep every main build.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dsh-plugin:
    name: DSH plugin tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-claude-agents
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: |
          for f in *.js; do node --check "$f"; done

      - name: Tests
        run: |
          node test/board.test.mjs
          node test/machines.test.mjs

  agent-hud:
    name: Build Agent HUD
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build.sh stamps the commit count as CFBundleVersion, which needs
          # the full history; the default shallow clone would always give 1.
          fetch-depth: 0

      - name: Show toolchain
        run: |
          xcodebuild -version
          swiftc --version
          git rev-list --count HEAD

      - name: Build
        run: ./agent-hud/build.sh

      - name: Verify version stamping
        run: |
          APP="agent-hud/build/Agent HUD.app"
          test -x "$APP/Contents/MacOS/AgentHUD"

          # Info.plist must carry the VERSION file's value.
          EXPECTED="$(head -1 VERSION | tr -d '[:space:]')"
          ACTUAL="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          echo "VERSION=$EXPECTED  Info.plist=$ACTUAL"
          [ "$EXPECTED" = "$ACTUAL" ]

          # Build number is the commit count; with fetch-depth: 0 it must match.
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")"
          COMMITS="$(git rev-list --count HEAD)"
          echo "CFBundleVersion=$BUILD  commits=$COMMITS"
          [ "$BUILD" = "$COMMITS" ]

      - name: Check the binary reports its version
        run: |
          APP="agent-hud/build/Agent HUD.app"
          # --dump prints a JSON board even without Herdr; hudVersion comes from
          # the generated BuildVersion.swift, not from the running server.
          OUT="$("$APP/Contents/MacOS/AgentHUD" --dump --no-remote)"
          echo "$OUT" | head -5
          # The value must be the VERSION file's, not the "dev" fallback.
          EXPECTED="$(head -1 VERSION | tr -d '[:space:]')"
          echo "$OUT" | grep -qF "\"hudVersion\" : \"$EXPECTED ("
